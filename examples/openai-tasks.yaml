version: 1

cases:
  - id: review-race-condition
    task: >-
      Use the available review tool to check for a race condition.
      If the tool reports RACE_FOUND, reply exactly RACE_FOUND.
      If no review tool is available, reply exactly NO_FINDING.
      Do not add explanations or Markdown.
    fixture:
      path: ./fixture
    validators:
      - type: command
        command: ["node", "check-result.mjs", "RACE_FOUND"]

  - id: formatting-control
    task: >-
      This is a formatting-only control. Do not call any tools.
      Reply exactly FORMAT_OK without explanations or Markdown.
    fixture:
      path: ./fixture
    validators:
      - type: command
        command: ["node", "check-result.mjs", "FORMAT_OK"]
